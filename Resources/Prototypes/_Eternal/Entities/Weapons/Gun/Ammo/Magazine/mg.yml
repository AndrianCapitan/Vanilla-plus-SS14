- type: Tag
  id: EternalMagazineMG

- type: entity
  abstract: true
  parent: BaseItem
  id: EternalBaseMagazineLightRifle
  name: Магазин
  components:
  - type: Tag
    tags:
      - EternalMagazineMG
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - EternalCartridgeRifle
    proto: EternalCartridgeRifle
    capacity: 30
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

