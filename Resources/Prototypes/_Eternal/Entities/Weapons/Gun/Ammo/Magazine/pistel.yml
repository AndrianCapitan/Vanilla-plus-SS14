- type: Tag
  id: EternalMagazinePistol

- type: entity
  abstract: true
  parent: BaseItem
  id: EternalBaseMagazinePistol
  name: магазин (.50 авто)
  components:
  - type: Tag
    tags:
      - EternalMagazinePistol
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - EternalCatridgePistol
    capacity: 7
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pistol_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: EternalBaseMagazinePistol
  id: EternalMagazinePistolAny
  name: магазин (.50 авто пустой)
  suffix: Пустой
  description: 7 зарядный магазин для "Пустынного Орла"
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

