- type: Tag
  id: EternalMagazineRifle

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineRifleEternal
  name: "Магазин (.5,56 автомат)"
  components:
  - type: Tag
    tags:
      - EternalMagazineRifle
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - EternalCartridgeRifle
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Rifle/rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: MagazineRifle
  id: EternalMagazineRifleEmpty
  name: "магазин (.5,56 Пустой)"
  suffix: Пустой
  description: 30 зарядный магазин на пули калибром 5,56 
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

