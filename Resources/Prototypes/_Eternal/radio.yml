- type: radioChannel
  id: HECUBaseRadio
  name: Военная
  keycode: 'й'
  frequency: 1488
  color: "#A9A9A9"

- type: entity
  parent: EncryptionKey
  id: HECUBaseRadioKey
  suffix: Eternal
  name: Ключ Частоты Военных
  description: Это частота для военных
  components:
  - type: EncryptionKey
    channels:
    - HECUBaseRadio
    defaultChannel: HECUBaseRadio
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label

- type: entity
  parent: TelecomServer
  id: TelecomServerHECUBase
  suffix: Eternal
  name: Телекоммуникационные сервера
  components:
  - type: ContainerFill
    containers:
     key_slots:
      - HECUBaseRadioKey

- type: radioChannel
  id: HECUCommandRadio
  name: Командная
  keycode: 'к'
  frequency: 1489
  color: "#fcdf03"

- type: entity
  parent: EncryptionKey
  id: HECUCommandRadioKey
  suffix: Eternal
  name: Ключ Частоты Командования
  description: Это частота командования
  components:
  - type: EncryptionKey
    channels:
    - HECUCommandRadio
    defaultChannel: HECUCommandRadio
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: cap_label

- type: entity
  parent: EncryptionKey
  id: HECUCommandFullRadioKey
  suffix: Eternal
  name: Ключ Частоты Полный
  description: Дает все частоты HECU
  components:
  - type: EncryptionKey
    channels:
    - HECUCommandRadio
    - HECUBaseRadio
    - HECUCargoRadio
    - HECUArtaRadio
    defaultChannel: HECUCommandRadio
  - type: Sprite
    layers:
    - state: crypt_gold
    - state: cap_label

- type: entity
